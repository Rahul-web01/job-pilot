<!doctype html>
<html><head><meta charset="utf-8"><title>Test application form</title></head>
<body>
<form id="application" onsubmit="window.submitted = true; return false;">
  <label for="first_name">First Name *</label><input id="first_name" required>
  <label for="last_name">Last Name *</label><input id="last_name" required>
  <label for="email">Email *</label><input id="email" type="email" required>
  <label for="phone">Phone</label><input id="phone" type="tel">
  <div class="field"><label>Resume/CV *</label><input id="resume" type="file" required></div>
  <div class="field"><label>Cover Letter</label><input id="cover_letter" type="file"></div>
  <label for="q1">LinkedIn Profile</label><input id="q1" type="text">
  <label for="q2">What is your notice period?</label><input id="q2" type="text">
  <label for="q3">Why do you want to work here? *</label><textarea id="q3" required></textarea>
  <label for="q4">Are you legally authorized to work in India? *</label>
  <select id="q4" required><option value=""></option><option>Yes</option><option>No</option></select>
  <button type="submit">Submit application</button>
</form>
</body></html>
